# The licences a crate of the locked graph may carry: every crate, on every
# platform, build-time crates included. `make licences` runs cargo-deny on this
# list. A licence not named here stops the gate, so a new licence is a decision
# taken in this file and not a side effect of a dependency update.

[graph]
all-features = true

[licenses]
allow = [
    "EUPL-1.2",
    "MIT",
    # unicode-ident, a build-time crate, carries the Unicode tables under it.
    "Unicode-3.0",
]
