---
name: CI

'on':
  pull_request:
    # Title (the squash subject, read by the semver job) or base edits rerun
    # every job; jobs take seconds and none is skipped on edited, since a
    # skipped required check would report success over an earlier failure.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: ['main']
  merge_group:

# No job writes through the token; checkout only reads (same as reuse.yml).
permissions:
  contents: read

env:
  # cargo-deny runs the licence allow-list of deny.toml and the advisories
  # check. The digest is the one its release page publishes for the Linux
  # archive of this version.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256_LINUX: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  # cargo-mutants tests the tests: it changes the code a pull request
  # touches and expects a test to fail. The digest is the one its release
  # publishes for the Linux archive of this version.
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256_LINUX: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"
  # cargo-semver-checks holds the public Rust API of each library crate to the
  # pull request's base: a breaking change fails unless the title marks it with
  # `!`. The digest is the one its release publishes for the Linux archive of
  # this version.
  CARGO_SEMVER_CHECKS_VERSION: "0.51.0"
  CARGO_SEMVER_CHECKS_SHA256_LINUX: "396c8508d973c83de52660943a057e971b586f7511c3ba695762373452b43d5b"

jobs:
  test:
    runs-on: ubuntu-26.04
    # Floor: hosted runner setup + checkout jitter on a sub-minute job.
    timeout-minutes: 5
    # Every cargo step builds with rustc warnings as errors (HISS-10), the test
    # build included; praetorctl audit fails a cargo lane without it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v7

      # Hand edit until the engine's rust-systems template carries this guard
      # (praetor order engine-flavor-ci-no-manifest-guard-1723): with no root
      # Cargo.toml there is no crate to check, so the cargo steps are skipped
      # with the reason printed; the first crate turns them on.
      - name: Detect the Cargo workspace
        id: manifest
        if: github.event.pull_request.draft != true
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root Cargo.toml yet: cargo fmt, clippy and test skipped until the first crate lands."
          fi

      # rustup ships on the hosted runner image, so the toolchain needs no
      # third-party action.
      - name: Install the stable toolchain
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: Lint
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo test --all-features

      # The script holds the archive to its pinned digest before anything is
      # unpacked; a changed archive fails the comparison.
      - name: Install the pinned cargo-deny
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          python3 -B "$GITHUB_WORKSPACE/tools/fetch_release.py" \
            --repo EmbarkStudios/cargo-deny \
            --tag "${CARGO_DENY_VERSION}" \
            --asset "${archive}.tar.gz" \
            --sha256 "${CARGO_DENY_SHA256_LINUX}" \
            --out "${archive}.tar.gz"
          mkdir -p bin
          tar -xzf "${archive}.tar.gz" "${archive}/cargo-deny"
          install -m 0755 "${archive}/cargo-deny" bin/cargo-deny
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The allow-list over the locked graph, then the planted crate under
      # tools/deny/fixtures/refused, which the check has to refuse.
      - name: Licence check
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: make licences

      # The RustSec advisories over the locked graph, then the planted crate
      # under tools/deny/fixtures/advised, which the check has to report.
      - name: Advisory check
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: make advisories

      # Codacy runs Bandit and Prospector, which accept a nosec with no
      # reason or with one Bandit reads as test names; these steps refuse
      # both. Python only, so no Cargo workspace is needed.
      - name: Selftest the nosec check
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_nosec.py --selftest

      - name: Refuse a nosec without rule ids and a reason
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_nosec.py

      # Pull-request workflows and ruleset required status checks must match in
      # both directions so no job runs unrequired. Python only, so no Cargo
      # workspace is needed.
      - name: Selftest the required-check list
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_required_checks.py --selftest

      - name: Refuse a pull-request job the ruleset does not require
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_required_checks.py

      # Planted crates must sit under a fixtures directory so the engine does
      # not read them as library nodes. Python and git only, so no Cargo
      # workspace is needed. No macOS or Windows leg: the check reads git's
      # tracked tree, which is the same on every host, through git's
      # '/'-separated paths, pathlib and explicit UTF-8, and its selftest
      # builds its scratch repositories the same way.
      - name: Selftest the planted-crate check
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_planted_crates.py --selftest

      - name: Refuse a planted crate outside a fixtures directory
        if: github.event.pull_request.draft != true
        run: python3 -B tools/check_planted_crates.py

      - name: Selftest the release fetch
        if: github.event.pull_request.draft != true
        run: python3 -B tools/fetch_release.py --selftest

  # Like the test job, it fails a draft in its first step rather than skipping
  # it in the job condition: a skipped job reports success.
  # macOS and Windows get no leg: saeptum-microvm builds only on Linux
  # (AF_VSOCK through socket2), and the semver job's 'Refuse OS-conditional
  # items' step fails once any other crate gains an OS-conditional item, so a
  # mutant behaves the same on every host.
  mutants:
    name: Mutation testing (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - &draft-stop
        name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - &full-history-checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # With no toolchain argument rustup installs the channel
      # rust-toolchain.toml pins.
      - &pinned-toolchain
        name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup show active-toolchain

      - name: Install cargo-mutants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          python3 -B "$GITHUB_WORKSPACE/tools/fetch_release.py" \
            --repo sourcefrog/cargo-mutants \
            --tag "v${CARGO_MUTANTS_VERSION}" \
            --asset "$archive" \
            --sha256 "${CARGO_MUTANTS_SHA256_LINUX}" \
            --out "$archive"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" cargo-mutants
          rm "$archive"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Mutate the changed code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo mutants --version
          git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No Rust change; nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --timeout 300 \
            --all-features --cargo-arg=--locked -o "$RUNNER_TEMP"

      - name: Summarise missed mutants
        if: always()
        run: |
          out="$RUNNER_TEMP/mutants.out"
          [ -d "$out" ] || exit 0
          for kind in caught missed timeout unviable; do
            printf '%s: %s\n' "$kind" "$(wc -l < "$out/$kind.txt")"
          done >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$out/missed.txt" ]; then
            { echo '```'; cat "$out/missed.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  semver:
    name: Public API (cargo-semver-checks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The mutants job's draft stop, by alias.
      - *draft-stop

      # The mutants job's checkout, by alias.
      - *full-history-checkout

      # The mutants job's toolchain step, by alias.
      - *pinned-toolchain

      # Firecracker runs x86_64 and aarch64 guests, and saeptum-microvm's
      # public BOOT_TIMER_ADDRESS differs per architecture, so the API is
      # checked for both; rustdoc needs the aarch64 standard library only.
      - name: Add the aarch64 standard library
        run: rustup target add aarch64-unknown-linux-gnu

      # macOS and Windows get no leg: saeptum-microvm builds only on Linux
      # (AF_VSOCK through socket2 exists only on Linux and Android), and
      # this refusal covers each gated crate's src/ tree, using the same
      # selection as semver_scope.py. Integration tests and public-api = false
      # crates are outside the gated API. An OS-conditional item in gated
      # sources requires an API gate leg per OS.
      - name: Refuse OS-conditional items
        run: python3 -B tools/semver_scope.py os-conditional

      - name: Install cargo-semver-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz
          python3 -B "$GITHUB_WORKSPACE/tools/fetch_release.py" \
            --repo obi1kenobi/cargo-semver-checks \
            --tag "v${CARGO_SEMVER_CHECKS_VERSION}" \
            --asset "$archive" \
            --sha256 "${CARGO_SEMVER_CHECKS_SHA256_LINUX}" \
            --out "$archive"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" cargo-semver-checks
          rm "$archive"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Selftest the package selection
        run: python3 -B tools/semver_scope.py selftest

      # The title is read from the environment, never interpolated into the
      # script.
      - name: Check the public API against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          cargo semver-checks --version
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            python3 -B tools/semver_scope.py check --baseline-rev "$BASE_SHA" --subject="$PR_TITLE" --target "$target" || exit 1
          done
