---
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:

jobs:
  test:
    runs-on: ubuntu-26.04
    # Every cargo step builds with rustc warnings as errors (HISS-10), the test
    # build included; praetorctl audit fails a cargo lane without it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4

      # Hand edit until the engine's rust-systems template carries this guard
      # (praetor order engine-flavor-ci-no-manifest-guard-1723): with no root
      # Cargo.toml there is no crate to check, so the cargo steps are skipped
      # with the reason printed; the first crate turns them on.
      - name: Detect the Cargo workspace
        id: manifest
        if: github.event.pull_request.draft != true
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root Cargo.toml yet: cargo fmt, clippy and test skipped until the first crate lands."
          fi

      # rustup ships on the hosted runner image, so the toolchain needs no
      # third-party action.
      - name: Install the stable toolchain
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: Lint
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: github.event.pull_request.draft != true && steps.manifest.outputs.present == 'true'
        run: cargo test --all-features
