# cargo-mutants configuration. Each exclusion is a mutant no test can kill
# because it does not change behaviour; the reason sits beside it. Each
# entry is a category D exception (entered 2026-10-16, expires 2027-02-13):
# re-check it, or remove it when the code it names changes.
exclude_re = [
    # CorrelationId and Label are built only through their parse functions
    # (Deserialize calls them too), which refuse empty input, so len is
    # never 0 and is_empty is always false.
    'replace CorrelationId::is_empty -> bool with false',
    'replace Label::is_empty -> bool with false',
    # RingCore::new starts both counters at 0 and submit adds the same
    # count to both, so submitted == completed always holds.
    'replace RingCore::is_drained -> bool with true',
    # elapsed > budget and elapsed >= budget differ only when the monotonic
    # clock reads exactly the budget, to the nanosecond; no test can place
    # a sample there.
    'replace > with >= in read_line',
    'replace > with >= in RunningVm::connect',
    'replace > with >= in RunningVm::reap',
    # With == the elapsed check never fires, and the loop ends after
    # MAX_POLLS polls of POLL (10 s, at least BOOT_BUDGET and STOP_BUDGET)
    # with the same deadline error. In reap that path needs a killed child
    # that try_wait never reaps, which the kernel does not produce.
    'replace > with == in RunningVm::connect',
    'replace > with == in RunningVm::reap',
    # Child::kill returns Ok(()) when the child has already exited (std
    # documentation, Rust 1.99), and reap runs on a child that is not yet
    # reaped, so kill(pid, SIGKILL) on our own child cannot fail: the Err
    # arms in reap are unreachable.
    'replace match guard error\.kind\(\) == ErrorKind::InvalidInput with (true|false) in RunningVm::reap',
    'replace == with != in RunningVm::reap',
    # signal_boot_complete maps /dev/mem at Firecracker's boot timer
    # address, which only a guest may do: a test on the host would write to
    # the host's own physical memory when run as root. Its body is
    # write_marker, which the boot tests mutate; the Ok(()) mutant is
    # killed by the Guest-boot-time line Aegis OS checks per VM. Category D,
    # entered 2026-10-17, expires 2027-02-14.
    'replace signal_boot_complete -> Result<\(\), MicroVmError> with Ok\(\(\)\)',
]
