[package]
name = "saeptum-microvm"
description = "Firecracker microVMs on KVM for rows saeptum-capsule admitted: a per-VM configuration file booted with --no-api, one line-framed exchange over Firecracker's hybrid vsock, a bounded guest service on AF_VSOCK, and every process and socket torn down. No network device, no jailer, no API socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
saeptum-capsule = { path = "../saeptum-capsule" }
libc.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true

# The workspace lint tables, restated with unsafe_code = "deny" instead of
# "forbid": src/guest/boot.rs allows unsafe code in one function under a
# dated exception, and tests/unsafe_exception.rs holds these tables equal to
# the workspace ones in every other line.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
