version = 1

# The root licence text and files that cannot carry a header of their own.
[[annotations]]
path = ["LICENSE", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# Written by `praetorctl adopt` and held in step by `praetorctl audit`.
# "closest" keeps the terms a generated file states itself.
[[annotations]]
path = [
    ".agents/**",
    ".claude/**",
    ".codex/**",
    ".config/**",
    ".devcontainer/**",
    ".gemini/**",
    ".github/**",
    ".paperclip/**",
    ".vscode/**",
    "docs/**",
    ".editorconfig",
    ".gitattributes",
    ".standards-baseline.json",
    ".standards.lock",
    ".standards.yaml",
    "AGENTS.md",
    "AGENTS.readonly.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "Makefile",
    "SECURITY.md",
    "clippy.toml",
    "lefthook.yml",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# Renovate's configuration, added by the Renovate onboarding pull request.
[[annotations]]
path = ["renovate.json", ".github/renovate.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"
