<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Saeptum — bounded job sandbox library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- bounded enclosure geometry: three concentric isolation boundaries (microVM, capsule, runner) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="800" y="24" width="356" height="72" rx="12" stroke="url(#glow)" stroke-width="12"/>
    <rect x="800" y="24" width="356" height="72" rx="12" stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <rect x="816" y="36" width="98" height="48" rx="8" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
    <rect x="928" y="36" width="100" height="48" rx="8" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
    <rect x="1042" y="36" width="98" height="48" rx="8" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
    <circle cx="865" cy="60" r="4" fill="#06b6d4"/>
    <circle cx="978" cy="60" r="4" fill="#3b82f6"/>
    <circle cx="1091" cy="60" r="4" fill="#8b5cf6"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">Saeptum</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="360" y="52">MicroVM · WebAssembly capsule · bubblewrap</text>
    <text x="360" y="76">Bounded job isolation for Rust &amp; Go</text>
  </g>
</svg>
